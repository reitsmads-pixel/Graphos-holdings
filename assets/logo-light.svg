<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Graphos Holdings logo">
  <defs>
    <linearGradient id="g-accent-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b6ea5"/>
      <stop offset="0.5" stop-color="#6ea8dc"/>
      <stop offset="1" stop-color="#a8cdec"/>
    </linearGradient>
  </defs>
  <!-- G ring: circle stroke with a gap on the right side -->
  <circle cx="96" cy="100" r="62" fill="none" stroke="#ffffff" stroke-width="36"
          pathLength="100" stroke-dasharray="82 18" stroke-dashoffset="-9"/>
  <!-- G crossbar / accent square -->
  <rect x="100" y="94" width="70" height="46" fill="url(#g-accent-light)"/>
  <polygon points="100,140 170,94 170,140" fill="#85b8e4" opacity="0.55"/>
</svg>
